name: Release All (Existing)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to update from main with the same marketing version'
        required: true
        type: string
      versionCodeOverride:
        description: 'Optional Android version code override (passed to both Android workflows)'
        required: false
        type: string
      submit_android_playstore_for_review:
        description: 'Submit Android Play Store edit for review immediately.'
        required: false
        type: boolean
        default: true
      skip_android_playstore:
        description: 'Skip Android Play Store'
        required: false
        type: boolean
        default: false
      skip_android_apk:
        description: 'Skip Android Release APK'
        required: false
        type: boolean
        default: false
      skip_ios_ipa:
        description: 'Skip iOS Release IPA'
        required: false
        type: boolean
        default: false
      skip_ios_testflight:
        description: 'Skip iOS TestFlight'
        required: false
        type: boolean
        default: false
      skip_tvos_testflight:
        description: 'Skip tvOS TestFlight'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release-sha.outputs.sha }}
    steps:
      - name: Verify workflow runs from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Run Release All (Existing) from main and provide the release tag as input." >&2
            exit 1
          fi
      - name: Checkout dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify existing release and source version
        id: release-sha
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 .agents/skills/update-phoenix-version/scripts/update_version.py --version "${TAG#v}" --check
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare-release
    uses: ./.github/workflows/release-tests.yml
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}

  android-apk:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_android_apk }}
    uses: ./.github/workflows/android-release-apk.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      release_tag: ${{ inputs.release_tag }}
      versionCodeOverride: ${{ inputs.versionCodeOverride }}
      skip_tests: true
    secrets: inherit

  ios-ipa:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_ios_ipa }}
    uses: ./.github/workflows/ios-release-ipa.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      release_tag: ${{ inputs.release_tag }}
      skip_tests: true
    secrets: inherit

  android-playstore:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_android_playstore }}
    uses: ./.github/workflows/android-playstore.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      versionCodeOverride: ${{ inputs.versionCodeOverride }}
      submitForReview: ${{ inputs.submit_android_playstore_for_review }}
      skip_tests: true
    secrets: inherit

  ios-testflight:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_ios_testflight }}
    uses: ./.github/workflows/ios-testflight.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      skip_tests: true
    secrets: inherit

  tvos-testflight:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_tvos_testflight }}
    uses: ./.github/workflows/tvos-testflight.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.sha }}
      upload: true
    secrets: inherit

  summary:
    if: always()
    needs: [tests, prepare-release, android-apk, ios-ipa, android-playstore, ios-testflight, tvos-testflight]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Release All (Existing)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: ${{ needs.prepare-release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected builds and tests use the dispatched main commit with the existing release's marketing version." >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | ${{ needs.tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android Release APK | ${{ needs.android-apk.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS Release IPA | ${{ needs.ios-ipa.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android Play Store | ${{ needs.android-playstore.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS TestFlight | ${{ needs.ios-testflight.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tvOS TestFlight | ${{ needs.tvos-testflight.result }} |" >> "$GITHUB_STEP_SUMMARY"
