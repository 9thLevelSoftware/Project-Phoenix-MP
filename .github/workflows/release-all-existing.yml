name: Release All (Existing)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to rebuild/publish (TV requires tag SHA to match selected main revision)'
        required: true
        type: string
      versionCodeOverride:
        description: 'Optional Android version code override (passed to both Android workflows)'
        required: false
        type: string
      submit_android_playstore_for_review:
        description: 'Submit Android Play Store edit for review immediately.'
        required: false
        type: boolean
        default: true
      skip_android_playstore:
        description: 'Skip Android Play Store'
        required: false
        type: boolean
        default: false
      skip_android_apk:
        description: 'Skip Android Release APK'
        required: false
        type: boolean
        default: false
      skip_ios_ipa:
        description: 'Skip iOS Release IPA'
        required: false
        type: boolean
        default: false
      skip_ios_testflight:
        description: 'Skip iOS TestFlight'
        required: false
        type: boolean
        default: false
      skip_tvos_testflight:
        description: 'Skip tvOS TestFlight (required for a tag older than the selected main revision)'
        required: false
        type: boolean
        default: false
      tvos_review_pr:
        description: 'PR covering this exact revision with trusted independent tvOS review (required unless TV skipped)'
        required: false
        type: string
      tvos_review_accepted:
        description: 'Independent tvOS review and beta acceptance complete (required unless TV skipped)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  statuses: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release-sha.outputs.sha }}
    steps:
      - name: Verify workflow runs from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Run Release All (Existing) from main and provide the release tag as input." >&2
            exit 1
          fi
      - name: Verify release and resolve its commit
        id: release-sha
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ inputs.release_tag }}
          SKIP_TVOS: ${{ inputs.skip_tvos_testflight }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          object=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq .object)
          object_type=$(jq -r .type <<< "$object")
          sha=$(jq -r .sha <<< "$object")
          while [ "$object_type" = "tag" ]; do
            object=$(gh api "repos/${{ github.repository }}/git/tags/$sha" --jq .object)
            object_type=$(jq -r .type <<< "$object")
            sha=$(jq -r .sha <<< "$object")
          done
          test "$object_type" = "commit"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$SKIP_TVOS" != "true" ] && [ "$sha" != "$WORKFLOW_SHA" ]; then
            echo "tvOS recovery requires the release tag to resolve to this run's selected main revision. For historical mobile recovery, set skip_tvos_testflight=true." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout the exact workflow and TV release revision
        if: ${{ !inputs.skip_tvos_testflight }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-revision tvOS review before recovery builds
        if: ${{ !inputs.skip_tvos_testflight }}
        env:
          TVOS_SOURCE_SHA: ${{ steps.release-sha.outputs.sha }}
          TVOS_REVIEW_PR: ${{ inputs.tvos_review_pr }}
          TVOS_REVIEW_ACCEPTED: ${{ inputs.tvos_review_accepted }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tvos-release.py review

  tests:
    needs: prepare-release
    uses: ./.github/workflows/release-tests.yml
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}

  android-apk:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_android_apk }}
    uses: ./.github/workflows/android-release-apk.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      release_tag: ${{ inputs.release_tag }}
      versionCodeOverride: ${{ inputs.versionCodeOverride }}
      skip_tests: true
    secrets: inherit

  ios-ipa:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_ios_ipa }}
    uses: ./.github/workflows/ios-release-ipa.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      release_tag: ${{ inputs.release_tag }}
      skip_tests: true
    secrets: inherit

  android-playstore:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_android_playstore }}
    uses: ./.github/workflows/android-playstore.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      versionCodeOverride: ${{ inputs.versionCodeOverride }}
      submitForReview: ${{ inputs.submit_android_playstore_for_review }}
      skip_tests: true
    secrets: inherit

  ios-testflight:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_ios_testflight }}
    uses: ./.github/workflows/ios-testflight.yml
    with:
      source_ref: ${{ needs.prepare-release.outputs.sha }}
      skip_tests: true
    secrets: inherit

  tvos-testflight:
    needs: [prepare-release, tests]
    if: ${{ !inputs.skip_tvos_testflight }}
    uses: ./.github/workflows/tvos-testflight.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.sha }}
      review_pr: ${{ inputs.tvos_review_pr }}
      review_accepted: ${{ inputs.tvos_review_accepted }}
      upload: true
    secrets: inherit

  summary:
    if: always()
    needs: [tests, prepare-release, android-apk, ios-ipa, android-playstore, ios-testflight, tvos-testflight]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Release All (Existing)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected builds and tests used the release tag's resolved commit." >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | ${{ needs.tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android Release APK | ${{ needs.android-apk.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS Release IPA | ${{ needs.ios-ipa.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android Play Store | ${{ needs.android-playstore.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS TestFlight | ${{ needs.ios-testflight.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tvOS TestFlight | ${{ needs.tvos-testflight.result }} |" >> "$GITHUB_STEP_SUMMARY"
