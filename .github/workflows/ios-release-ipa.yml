name: iOS Release IPA

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      release_tag:
        description: 'GitHub release tag to receive the IPA'
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      skip_tests:
        description: 'Set by release-all workflows, which already ran the release test gate.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Required to upload release assets

concurrency:
  group: ios-release-ipa
  cancel-in-progress: true

env:
  BUNDLE_ID: com.devil.phoenixproject.projectphoenix
  SCHEME: PhoenixApp
  PROJECT_PATH: iosApp/PhoenixApp/PhoenixApp.xcodeproj
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      ref: ${{ inputs.source_ref }}
      skip: ${{ inputs.skip_tests || false }}

  build-and-attach:
    needs: tests
    # Measured memory profile (cold compile + link, Sep 2026): the JVM peaks
    # ~5 GB in DevirtualizationAnalysis and the LLVM link peaks ~6.3 GB after it
    # — the phases are sequential, ~8 GB concurrent max. The standard x64 14 GB
    # image fits that with headroom and is free for public repos; larger runners
    # (macos-26-large, 30 GB) are always billed and drain the spending limit.
    runs-on: macos-26-intel

    steps:
      - name: Verify iOS release runner capacity
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          memory_bytes="$(sysctl -n hw.memsize)"
          echo "Runner architecture: $arch"
          echo "Runner memory bytes: $memory_bytes"
          if [[ "$arch" != "x86_64" || "$memory_bytes" -lt 12884901888 ]]; then
            echo "::error::Kotlin/Native release linking requires an x64 runner with at least 12 GiB RAM."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Write Supabase.xcconfig from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p iosApp/PhoenixApp/Config
          # xcconfig treats `//` as an inline comment, so URLs like `https://foo`
          # must be written as `https:/$()/foo` (empty xcconfig substitution) or
          # the value gets truncated to `https:` at parse time. Apply to both
          # fields defensively.
          url_escaped=$(printf '%s' "$SUPABASE_URL" | sed 's|//|/$()/|g')
          key_escaped=$(printf '%s' "$SUPABASE_ANON_KEY" | sed 's|//|/$()/|g')
          {
            echo "SUPABASE_URL = $url_escaped"
            echo "SUPABASE_ANON_KEY = $key_escaped"
          } > iosApp/PhoenixApp/Config/Supabase.xcconfig

      - name: Validate release app icons
        run: |
          python3 scripts/validate_ios_app_icons.py \
            --source iosApp/AppIcon1024.png
          python3 scripts/test_ios_app_icons.py

      - name: Verify target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}"

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Generate build number
        id: build_number
        run: |
          BUILD_NUM=$(date +%Y%m%d)${{ github.run_number }}
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD_NUM"

          # Update Xcode project with new build number
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" \
            iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj

          # Show what was set
          grep "CURRENT_PROJECT_VERSION" iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj | head -2

      # Compose Multiplatform 1.11 links UIKit symbols from the iOS 26 SDK.
      # Gradle/Kotlin Native and xcodebuild must use that same SDK.
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build shared framework and resources
        run: |
          # Single Gradle invocation — linkReleaseFrameworkIosArm64 already depends on
          # generateComposeResClass and resource processing, but listing them explicitly
          # ensures they run even if a dependency edge is missing. One JVM startup, not three.
          ./gradlew :shared:linkReleaseFrameworkIosArm64 \
            :shared:generateComposeResClass \
            :shared:iosArm64ProcessResources \
            --no-parallel -Pskip.supabase.check=true

          echo "=== Compose resource directories ==="
          find shared/build -type d -name "composeResources" 2>/dev/null | head -10

      - name: Install shared.framework for Xcode
        run: |
          # Debug and Release both link shared/build/bin/iosArm64/xcodeFramework.
          # Copy the release bundle there. The Xcode project does not link an
          # XCFramework, and it does not read debugFramework at archive time.
          #
          # Release All (Existing) runs this workflow from main against an older
          # tag's checkout. Tags before xcodeFramework (v1.0.3 and earlier) have no
          # install script and link debugFramework, so give them a real copy there.
          if grep -q 'iosArm64/xcodeFramework' iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj; then
            iosApp/install-xcode-framework.sh release
          else
            echo "Checkout predates xcodeFramework; installing the release bundle at debugFramework"
            LEGACY_DEST=shared/build/bin/iosArm64/debugFramework/shared.framework
            rm -rf "$LEGACY_DEST"
            mkdir -p "$LEGACY_DEST"
            cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework/. "$LEGACY_DEST"/
            test -s "$LEGACY_DEST/shared"
          fi

      - name: Install certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive app
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/PhoenixApp.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PhoenixApp.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Rename IPA with version
        id: rename_ipa
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          TAG="${{ inputs.release_tag }}"
          NEW_NAME="ProjectPhoenix-${TAG}.ipa"
          cp "$IPA_PATH" "$NEW_NAME"
          echo "ipa_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed IPA to: $NEW_NAME"

      # This workflow may build a historical tag, whose checkout predates the helper.
      # Fetch it from the immutable workflow revision rather than the build checkout.
      - name: Fetch pinned release asset replacement helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.workflow_sha }}/.github/scripts/replace_release_asset.py" \
            --output "$RUNNER_TEMP/replace_release_asset.py"
          python3 -m py_compile "$RUNNER_TEMP/replace_release_asset.py"

      - name: Stage and promote IPA on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/replace_release_asset.py" \
            "${{ inputs.release_tag }}" \
            "${{ steps.rename_ipa.outputs.ipa_path }}" \
            "ProjectPhoenix-${{ inputs.release_tag }}.ipa"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
