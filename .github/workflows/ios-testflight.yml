name: iOS TestFlight

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      fail_on_distribution_error:
        description: "Fail the run if adding the build to the TestFlight group or the Beta App Review submission fails. Set true for external-tester workflows; leave false for internal-only groups (audit F073)."
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      fail_on_distribution_error:
        required: false
        type: boolean

permissions:
  contents: write  # Needed to push testflight/* tags for release notes tracking

concurrency:
  group: ios-testflight
  cancel-in-progress: true  # Cancel older TestFlight builds if a new push comes in

env:
  BUNDLE_ID: com.devil.phoenixproject.projectphoenix
  SCHEME: PhoenixApp
  PROJECT_PATH: iosApp/PhoenixApp/PhoenixApp.xcodeproj
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Write Supabase.xcconfig from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p iosApp/PhoenixApp/Config
          # xcconfig treats `//` as an inline comment, so URLs like `https://foo`
          # must be written as `https:/$()/foo` (empty xcconfig substitution) or
          # the value gets truncated to `https:` at parse time. Apply to both
          # fields defensively.
          url_escaped=$(printf '%s' "$SUPABASE_URL" | sed 's|//|/$()/|g')
          key_escaped=$(printf '%s' "$SUPABASE_ANON_KEY" | sed 's|//|/$()/|g')
          {
            echo "SUPABASE_URL = $url_escaped"
            echo "SUPABASE_ANON_KEY = $key_escaped"
          } > iosApp/PhoenixApp/Config/Supabase.xcconfig

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-2.3.0-iosArm64
          restore-keys: |
            ${{ runner.os }}-konan-2.3.0-
            ${{ runner.os }}-konan-

      - name: Auto-increment build number
        id: build_number
        run: |
          # Generate build number from date and run number
          BUILD_NUM=$(date +%Y%m%d)${{ github.run_number }}
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD_NUM"

          # Update Xcode project with new build number
          # [0-9][0-9]* requires at least one digit to avoid matching empty strings
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" \
            iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj

          # Show what was set
          grep "CURRENT_PROJECT_VERSION" iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj | head -2

      - name: Build shared framework and resources
        run: |
          # Single Gradle invocation — linkReleaseFrameworkIosArm64 already depends on
          # generateComposeResClass and resource processing, but listing them explicitly
          # ensures they run even if a dependency edge is missing. One JVM startup, not three.
          ./gradlew :shared:linkReleaseFrameworkIosArm64 \
            :shared:generateComposeResClass \
            :shared:iosArm64ProcessResources \
            --no-parallel -Pskip.supabase.check=true

          echo "=== Compose resource directories ==="
          find shared/build -type d -name "composeResources" 2>/dev/null | head -10

      - name: Copy Compose resources to Xcode project directory
        run: |
          # Compose MP's DefaultIOsResourceReader looks for resources in the
          # app's main bundle at compose-resources/composeResources/[module]/...
          # With isStatic=true, resources CANNOT live inside the framework — they
          # are lost during static linking. They must be in the app bundle root.
          #
          # Resources are placed OUTSIDE the Xcode fileSystemSynchronizedGroups
          # directory (at iosApp/PhoenixApp/compose-resources/, not inside
          # PhoenixApp/PhoenixApp/) to prevent auto-inclusion that
          # flattens locale folders and causes .cvr filename collisions.
          # A Run Script Build Phase in the Xcode project copies them to the
          # bundle preserving directory structure.
          RESOURCE_DST="iosApp/PhoenixApp/compose-resources"
          rm -rf "$RESOURCE_DST"
          mkdir -p "$RESOURCE_DST"

          # Copy processed compose resources into the compose-resources/ wrapper.
          # The CMP runtime expects: Bundle.main/compose-resources/composeResources/[module]/...
          PROCESSED="shared/build/processedResources/iosArm64/main"
          if [ -d "$PROCESSED/composeResources" ]; then
            cp -R "$PROCESSED/composeResources" "$RESOURCE_DST/"
            echo "=== Copied compose resources to Xcode project directory ==="
            find "$RESOURCE_DST" -type f | head -20
          else
            # Fallback: discover dynamically if processed path changed
            FOUND=false
            while IFS= read -r d; do
              if [ "$(find "$d" -type f 2>/dev/null | head -1)" ]; then
                echo "Found compose resources at: $d"
                cp -R "$d" "$RESOURCE_DST/"
                FOUND=true
                break
              fi
            done < <(find shared/build -type d -name composeResources \
              -not -path "*/releaseFramework/*" \
              -not -path "*/debugFramework/*" \
              -not -path "*/compose-resources/*" 2>/dev/null)

            if [ "$FOUND" = true ]; then
              echo "=== Copied compose resources (fallback) ==="
              find "$RESOURCE_DST" -type f | head -20
            else
              echo "ERROR: No compose resources found under shared/build!"
              find shared/build -type d -name "composeResources" 2>/dev/null
              exit 1
            fi
          fi

      - name: Create XCFramework
        run: |
          FRAMEWORK="shared/build/bin/iosArm64/releaseFramework/shared.framework"
          if [ ! -d "$FRAMEWORK" ]; then
            echo "ERROR: Framework not found at $FRAMEWORK"
            ls -la shared/build/bin/iosArm64/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          xcodebuild -create-xcframework \
            -framework "$FRAMEWORK" \
            -output shared/build/XCFrameworks/release/shared.xcframework

      - name: Link framework to Xcode path
        run: |
          mkdir -p shared/build/bin/iosArm64/debugFramework
          ln -sfn ../releaseFramework/shared.framework shared/build/bin/iosArm64/debugFramework/shared.framework

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive app
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/PhoenixApp.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PhoenixApp.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Set up Python (for JWT + upload verification)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python cryptography library
        run: pip install cryptography

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          IPA_PATH="$RUNNER_TEMP/export/PhoenixApp.ipa"
          BUILD_VERSION="${{ steps.build_number.outputs.build_number }}"
          MARKETING_VERSION=$(grep 'MARKETING_VERSION' iosApp/PhoenixApp/PhoenixApp.xcodeproj/project.pbxproj | head -1 | sed 's/.*= //;s/;.*//')

          echo "=== IPA details ==="
          echo "IPA: $IPA_PATH ($(du -h "$IPA_PATH" | cut -f1))"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Build version: $BUILD_VERSION"
          echo "Marketing version: $MARKETING_VERSION"

          # --- Write JWT generation script (used here and in the next step) ---
          cat > "$RUNNER_TEMP/generate_jwt.py" << 'PYEOF'
          import base64, json, time, os
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64url(data):
              if isinstance(data, str):
                  data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          kid = os.environ['APPSTORE_API_KEY_ID']
          iss = os.environ['APPSTORE_ISSUER_ID']
          with open(os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{kid}.p8'), 'rb') as f:
              key = load_pem_private_key(f.read(), password=None)
          now = int(time.time())
          hdr = b64url(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}, separators=(',', ':')))
          pay = b64url(json.dumps({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}, separators=(',', ':')))
          msg = f"{hdr}.{pay}"
          r, s = decode_dss_signature(key.sign(msg.encode(), ec.ECDSA(hashes.SHA256())))
          print(f"{msg}.{b64url(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))}")
          PYEOF
          sed -i '' 's/^          //' "$RUNNER_TEMP/generate_jwt.py"

          generate_jwt() { python3 "$RUNNER_TEMP/generate_jwt.py"; }

          # --- Upload via xcrun altool with strict error handling ---
          # xcrun altool --upload-package silently fails on Xcode 26+ (exit 0 but
          # IPA never reaches App Store Connect). We capture all output, verify the
          # upload via the ASC API, and fall back to Transporter if needed.
          echo "=== Uploading IPA to App Store Connect ==="

          set +e
          ALTOOL_OUTPUT=$(xcrun altool --upload-package "$IPA_PATH" \
            --type ios \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_VERSION" \
            --bundle-short-version-string "$MARKETING_VERSION" \
            --apple-id "${{ secrets.APP_APPLE_ID }}" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1)
          ALTOOL_EXIT=$?
          set -e

          echo "altool exit code: $ALTOOL_EXIT"
          echo "altool output:"
          echo "$ALTOOL_OUTPUT"

          if [ $ALTOOL_EXIT -ne 0 ]; then
            echo "ERROR: altool upload failed with exit code $ALTOOL_EXIT"
            exit 1
          fi

          # Check for common silent-failure patterns in altool output
          if echo "$ALTOOL_OUTPUT" | grep -qi "error\|failed\|invalid"; then
            echo "ERROR: altool reported errors despite exit code 0"
            exit 1
          fi

          # Verify the upload actually reached Apple by checking the ASC API
          echo "=== Verifying upload reached App Store Connect ==="
          sleep 30
          VERIFY_JWT=$(generate_jwt)
          API_BASE="https://api.appstoreconnect.apple.com/v1"
          VERIFY_RESPONSE=$(curl -s --globoff -H "Authorization: Bearer $VERIFY_JWT" \
            "$API_BASE/builds?filter[version]=$BUILD_VERSION&limit=1")
          VERIFY_STATUS=$(echo "$VERIFY_RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data'][0]['attributes'].get('processingState','UNKNOWN') if data.get('data') else 'NOT_FOUND')" 2>/dev/null || echo "NOT_FOUND")

          echo "Build status 30s after upload: $VERIFY_STATUS"
          if [ "$VERIFY_STATUS" = "NOT_FOUND" ]; then
            echo ""
            echo "============================================"
            echo "ERROR: Build not found in App Store Connect after upload."
            echo "xcrun altool reported success but the IPA was never received."
            echo ""
            echo "This is a known issue with Xcode 26+ altool."
            echo "Attempting Transporter CLI fallback..."
            echo "============================================"
            echo ""

            TRANSPORTER="/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
            if [ -x "$TRANSPORTER" ]; then
              set +e
              TRANSPORTER_OUTPUT=$("$TRANSPORTER" -m upload \
                -assetFile "$IPA_PATH" \
                -apiKey "$APPSTORE_API_KEY_ID" \
                -apiIssuer "$APPSTORE_ISSUER_ID" \
                2>&1)
              TRANSPORTER_EXIT=$?
              set -e
              echo "Transporter exit: $TRANSPORTER_EXIT"
              echo "$TRANSPORTER_OUTPUT"
              if [ $TRANSPORTER_EXIT -ne 0 ]; then
                echo "ERROR: Transporter upload also failed"
                exit 1
              fi
            else
              echo "Transporter not found at $TRANSPORTER"
              echo "Install with: mas install 497799835 (or download from developer.apple.com)"
              exit 1
            fi
          fi

          echo "=== Upload completed ==="

      - name: Add build to TestFlight test group
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TESTFLIGHT_GROUP_NAME: ${{ secrets.TESTFLIGHT_GROUP_NAME }}  # e.g., "Internal Testers"
        run: |
          set -e

          # Function to generate JWT using Python script
          generate_jwt() {
            python3 $RUNNER_TEMP/generate_jwt.py
          }

          echo "=== Generating JWT for App Store Connect API ==="
          JWT=$(generate_jwt)
          if [ -z "$JWT" ]; then
            echo "ERROR: Failed to generate JWT"
            exit 1
          fi
          echo "JWT generated successfully (length: ${#JWT})"

          API_BASE="https://api.appstoreconnect.apple.com/v1"

          echo "=== Fetching App ID for bundle: $BUNDLE_ID ==="
          APP_RESPONSE=$(curl -s --globoff -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $JWT" \
            "$API_BASE/apps?filter[bundleId]=$BUNDLE_ID")
          HTTP_CODE=$(echo "$APP_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          APP_RESPONSE=$(echo "$APP_RESPONSE" | grep -v "HTTP_CODE:")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: API call failed with HTTP $HTTP_CODE"
            echo "Response: $APP_RESPONSE"
            exit 1
          fi

          APP_ID=$(echo "$APP_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])" 2>&1) || {
            echo "ERROR: Failed to parse App ID from response"
            echo "Response: $APP_RESPONSE"
            exit 1
          }
          echo "App ID: $APP_ID"

          # Get beta group ID
          echo "=== Fetching beta groups ==="
          GROUPS_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $JWT" \
            "$API_BASE/apps/$APP_ID/betaGroups")
          HTTP_CODE=$(echo "$GROUPS_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          GROUPS_RESPONSE=$(echo "$GROUPS_RESPONSE" | grep -v "HTTP_CODE:")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Beta groups API call failed with HTTP $HTTP_CODE"
            echo "Response: $GROUPS_RESPONSE"
            exit 1
          fi
          GROUP_ID=$(echo "$GROUPS_RESPONSE" | python3 -c "
          import sys,json
          data = json.load(sys.stdin)
          target = '$TESTFLIGHT_GROUP_NAME'
          for g in data['data']:
              if g['attributes']['name'] == target:
                  print(g['id'])
                  break
          ")
          echo "Beta Group ID: $GROUP_ID"

          if [ -z "$GROUP_ID" ]; then
            echo "ERROR: Could not find beta group '$TESTFLIGHT_GROUP_NAME'"
            echo "Available groups:"
            echo "$GROUPS_RESPONSE" | python3 -c "import sys,json; [print('  -', g['attributes']['name']) for g in json.load(sys.stdin)['data']]"
            exit 1
          fi

          # Wait for build to finish processing (check every 30 seconds, max 20 minutes)
          echo "=== Waiting for build to process (this may take several minutes) ==="
          BUILD_ID=""
          BUILD_VERSION="${{ steps.build_number.outputs.build_number }}"
          echo "Looking for build version: $BUILD_VERSION"

          for i in {1..40}; do
            # Refresh JWT if needed (they expire after 20 min)
            if [ $((i % 20)) -eq 0 ]; then
              JWT=$(generate_jwt)
            fi

            BUILDS_RESPONSE=$(curl -s --globoff -H "Authorization: Bearer $JWT" \
              "$API_BASE/builds?filter[app]=$APP_ID&filter[version]=$BUILD_VERSION&limit=1")

            BUILD_STATUS=$(echo "$BUILDS_RESPONSE" | python3 -c "
          import sys,json
          data = json.load(sys.stdin)
          if data.get('data'):
              b = data['data'][0]
              status = b['attributes'].get('processingState', 'UNKNOWN')
              print(status)
          else:
              print('NOT_FOUND')
          " 2>/dev/null || echo "NOT_FOUND")

            echo "Build status: $BUILD_STATUS (attempt $i/40)"

            if [ "$BUILD_STATUS" = "VALID" ]; then
              BUILD_ID=$(echo "$BUILDS_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")
              break
            elif [ "$BUILD_STATUS" = "INVALID" ]; then
              echo "ERROR: Build is invalid and cannot be distributed"
              exit 1
            fi

            sleep 30
          done

          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Build did not finish processing in time"
            exit 1
          fi

          echo "Build ID: $BUILD_ID"

          # Set "What to Test" notes (required for external TestFlight groups)
          echo "=== Setting 'What to Test' notes for external review ==="

          # First, check if a localization already exists for this build
          LOCALIZATIONS_RESPONSE=$(curl -s -H "Authorization: Bearer $JWT" \
            "$API_BASE/builds/$BUILD_ID/betaBuildLocalizations")

          EXISTING_LOCALIZATION_ID=$(echo "$LOCALIZATIONS_RESPONSE" | python3 -c "
          import sys,json
          data = json.load(sys.stdin)
          for loc in data.get('data', []):
              if loc['attributes'].get('locale') == 'en-US':
                  print(loc['id'])
                  break
          " 2>/dev/null || echo "")

          # Generate what-to-test notes from commits since last TestFlight build
          echo "Generating release notes from git history..."

          # Find the most recent testflight tag
          LAST_TF_TAG=$(git tag -l 'testflight/*' --sort=-version:refname | head -1)

          if [ -n "$LAST_TF_TAG" ]; then
            echo "Last TestFlight tag: $LAST_TF_TAG"
            # Get commits since last TestFlight build
            COMMIT_LOG=$(git log --pretty=format:"• %s" "$LAST_TF_TAG"..HEAD --no-merges | head -20)
          else
            echo "No previous TestFlight tag found, using last 15 commits"
            # No prior tag - get last 15 commits
            COMMIT_LOG=$(git log --pretty=format:"• %s" -15 --no-merges)
          fi

          # Build the what-to-test message
          if [ -n "$COMMIT_LOG" ]; then
            WHATS_NEW="Changes in this build:

          $COMMIT_LOG

          Please test these changes and report any issues via TestFlight feedback."
          else
            WHATS_NEW="Maintenance build. Please test general app stability and report any issues via TestFlight feedback."
          fi

          echo "Generated release notes:"
          echo "$WHATS_NEW"

          # Escape for JSON
          WHATS_NEW_JSON=$(echo "$WHATS_NEW" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")

          if [ -n "$EXISTING_LOCALIZATION_ID" ]; then
            # Update existing localization
            echo "Updating existing localization: $EXISTING_LOCALIZATION_ID"
            LOCALIZATION_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              -d '{
                "data": {
                  "type": "betaBuildLocalizations",
                  "id": "'"$EXISTING_LOCALIZATION_ID"'",
                  "attributes": {
                    "whatsNew": '"$WHATS_NEW_JSON"'
                  }
                }
              }' \
              "$API_BASE/betaBuildLocalizations/$EXISTING_LOCALIZATION_ID")
          else
            # Create new localization
            echo "Creating new localization for en-US"
            LOCALIZATION_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              -d '{
                "data": {
                  "type": "betaBuildLocalizations",
                  "attributes": {
                    "locale": "en-US",
                    "whatsNew": '"$WHATS_NEW_JSON"'
                  },
                  "relationships": {
                    "build": {
                      "data": {
                        "type": "builds",
                        "id": "'"$BUILD_ID"'"
                      }
                    }
                  }
                }
              }' \
              "$API_BASE/betaBuildLocalizations")
          fi

          LOC_HTTP_CODE=$(echo "$LOCALIZATION_RESPONSE" | tail -1)
          LOC_BODY=$(echo "$LOCALIZATION_RESPONSE" | sed '$d')

          if [ "$LOC_HTTP_CODE" = "200" ] || [ "$LOC_HTTP_CODE" = "201" ]; then
            echo "SUCCESS: 'What to Test' notes set successfully"
          else
            echo "WARNING: Failed to set 'What to Test' notes (HTTP $LOC_HTTP_CODE)"
            echo "$LOC_BODY"
            # Continue anyway - this is non-blocking for internal groups
          fi

          # Set export compliance (required for external TestFlight)
          echo "=== Setting export compliance information ==="
          COMPLIANCE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{
              "data": {
                "type": "builds",
                "id": "'"$BUILD_ID"'",
                "attributes": {
                  "usesNonExemptEncryption": false
                }
              }
            }' \
            "$API_BASE/builds/$BUILD_ID")

          COMP_HTTP_CODE=$(echo "$COMPLIANCE_RESPONSE" | tail -1)
          if [ "$COMP_HTTP_CODE" = "200" ]; then
            echo "SUCCESS: Export compliance set (usesNonExemptEncryption: false)"
          else
            echo "WARNING: Failed to set export compliance (HTTP $COMP_HTTP_CODE)"
            echo "$(echo "$COMPLIANCE_RESPONSE" | sed '$d')"
          fi

          # Add build to beta group
          echo "=== Adding build to test group '$TESTFLIGHT_GROUP_NAME' ==="
          ADD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"data":[{"type":"builds","id":"'"$BUILD_ID"'"}]}' \
            "$API_BASE/betaGroups/$GROUP_ID/relationships/builds")

          HTTP_CODE=$(echo "$ADD_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$ADD_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "SUCCESS: Build added to test group '$TESTFLIGHT_GROUP_NAME'"
          else
            echo "WARNING: Unexpected response code $HTTP_CODE"
            echo "$RESPONSE_BODY"
            # F073: build was uploaded, but it was NOT added to the tester group.
            # For external-tester workflows this means testers get nothing, so
            # allow the run to fail when the caller opts in.
            if [ "${{ inputs.fail_on_distribution_error }}" = "true" ]; then
              echo "ERROR: failing because fail_on_distribution_error=true and the build was not added to '$TESTFLIGHT_GROUP_NAME'"
              exit 1
            fi
          fi

          # Submit for Beta App Review (required for external TestFlight groups)
          echo "=== Submitting build for Beta App Review ==="
          REVIEW_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{
              "data": {
                "type": "betaAppReviewSubmissions",
                "relationships": {
                  "build": {
                    "data": {
                      "type": "builds",
                      "id": "'"$BUILD_ID"'"
                    }
                  }
                }
              }
            }' \
            "$API_BASE/betaAppReviewSubmissions")

          REVIEW_HTTP_CODE=$(echo "$REVIEW_RESPONSE" | tail -1)
          REVIEW_BODY=$(echo "$REVIEW_RESPONSE" | sed '$d')

          if [ "$REVIEW_HTTP_CODE" = "201" ] || [ "$REVIEW_HTTP_CODE" = "200" ]; then
            echo "SUCCESS: Build submitted for Beta App Review"
          elif [ "$REVIEW_HTTP_CODE" = "409" ]; then
            echo "INFO: Build already submitted for review or review not required (internal group)"
          else
            echo "WARNING: Failed to submit for Beta App Review (HTTP $REVIEW_HTTP_CODE)"
            echo "$REVIEW_BODY"
            # F073: an internal-only group doesn't require review, so this is
            # tolerated by default; external-tester workflows can opt in to fail.
            if [ "${{ inputs.fail_on_distribution_error }}" = "true" ]; then
              echo "ERROR: failing because fail_on_distribution_error=true and Beta App Review submission failed"
              exit 1
            fi
          fi

      - name: Tag build for release notes tracking
        run: |
          BUILD_VERSION="${{ steps.build_number.outputs.build_number }}"
          TAG_NAME="testflight/$BUILD_VERSION"

          # Configure git for tagging
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create and push tag
          git tag -a "$TAG_NAME" -m "TestFlight build $BUILD_VERSION"
          git push origin "$TAG_NAME" || echo "Warning: Could not push tag (may already exist)"

          echo "Tagged commit as $TAG_NAME for future release notes"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
