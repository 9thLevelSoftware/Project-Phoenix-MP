name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      versionCodeOverride:
        description: 'Optional version code override (must be > current Play max and <= 2100000000)'
        required: false
        type: string
      release_tag:
        description: 'GitHub release tag to receive the APK'
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      versionCodeOverride:
        required: false
        type: string
      skip_tests:
        description: 'Set by release-all workflows, which already ran the release test gate.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Required to upload release assets

concurrency:
  group: android-release-apk
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      ref: ${{ inputs.source_ref }}
      skip: ${{ inputs.skip_tests || false }}

  build-and-attach:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Authenticate to Google Play API
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}"

      # This workflow may build a historical tag, whose checkout predates the helper.
      # Fetch it from the immutable workflow revision rather than the build checkout.
      - name: Resolve monotonic version code from Google Play
        id: version
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: com.devil.phoenixproject
          VERSION_CODE_OVERRIDE: ${{ inputs.versionCodeOverride }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.workflow_sha }}/.github/scripts/resolve-play-version-code.sh" \
            --output "$RUNNER_TEMP/resolve-play-version-code.sh"
          bash "$RUNNER_TEMP/resolve-play-version-code.sh"

      - name: Write Supabase credentials to local.properties
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Verify Android Supabase runtime config
        run: ./gradlew :androidApp:verifySupabaseRuntimeConfig

      - name: Build Release APK (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          ./gradlew :androidApp:assembleRelease \
            :androidApp:verifyReleaseCueResources \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pversion.code=${{ steps.version.outputs.selected_version_code }}
          rm keystore.jks

      - name: Rename APK with version
        id: rename_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -1)
          TAG="${{ inputs.release_tag }}"
          NEW_NAME="ProjectPhoenix-${TAG}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed APK to: $NEW_NAME"

      # This workflow may build a historical tag, whose checkout predates the helper.
      # Fetch it from the immutable workflow revision rather than the build checkout.
      - name: Fetch pinned release asset replacement helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.workflow_sha }}/.github/scripts/replace_release_asset.py" \
            --output "$RUNNER_TEMP/replace_release_asset.py"
          python3 -m py_compile "$RUNNER_TEMP/replace_release_asset.py"

      - name: Stage and promote APK on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/replace_release_asset.py" \
            "${{ inputs.release_tag }}" \
            "${{ steps.rename_apk.outputs.apk_path }}" \
            "ProjectPhoenix-${{ inputs.release_tag }}.apk"
