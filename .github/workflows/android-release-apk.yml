name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      versionCodeOverride:
        description: 'Optional version code override (must be > current Play max and <= 2100000000)'
        required: false
        type: string
      release_tag:
        description: 'GitHub release tag to receive the APK'
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      versionCodeOverride:
        required: false
        type: string
      skip_tests:
        description: 'Set by release-all workflows, which already ran the release test gate.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Required to upload release assets

concurrency:
  group: android-release-apk
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      ref: ${{ inputs.source_ref }}
      skip: ${{ inputs.skip_tests || false }}

  build-and-attach:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Authenticate to Google Play API
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}"

      - name: Resolve monotonic version code from Google Play
        id: version
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: com.devil.phoenixproject
          VERSION_CODE_OVERRIDE: ${{ inputs.versionCodeOverride }}
        run: |
          set -euo pipefail

          cleanup() {
            if [ -n "${EDIT_ID:-}" ]; then
              curl --silent --show-error --fail \
                -X DELETE \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID" \
                >/dev/null || echo "Warning: failed to delete temporary Play edit $EDIT_ID" >&2
            fi
          }

          trap cleanup EXIT

          EDIT_RESPONSE="$(curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")"
          EDIT_ID="$(printf '%s' "$EDIT_RESPONSE" | jq -r '.id // empty')"

          if [ -z "$EDIT_ID" ]; then
            echo "Failed to create a temporary Google Play edit." >&2
            printf '%s\n' "$EDIT_RESPONSE" >&2
            exit 1
          fi

          TRACKS_RESPONSE="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$EDIT_ID/tracks")"
          PLAY_MAX_VERSION_CODE="$(printf '%s' "$TRACKS_RESPONSE" | jq -r '[.tracks[]?.releases[]?.versionCodes[]? | tonumber] | max // empty')"

          if [ -n "$PLAY_MAX_VERSION_CODE" ]; then
            PLAY_MAX_OUTPUT="$PLAY_MAX_VERSION_CODE"
          else
            PLAY_MAX_OUTPUT="none"
            PLAY_MAX_VERSION_CODE=0
          fi

          OVERRIDE="$(printf '%s' "${VERSION_CODE_OVERRIDE:-}" | xargs)"
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[0-9]+$ ]]; then
              echo "Invalid workflow input versionCodeOverride='$OVERRIDE'. Expected a positive integer <= 2100000000." >&2
              exit 1
            fi

            SELECTED_VERSION_CODE="$OVERRIDE"
            VERSION_CODE_SOURCE="manual_override"
          else
            if [ "$PLAY_MAX_OUTPUT" = "none" ]; then
              echo "No existing Play version codes were found. Provide workflow_dispatch input versionCodeOverride to seed the next release." >&2
              exit 1
            fi

            SELECTED_VERSION_CODE=$((PLAY_MAX_VERSION_CODE + 1))
            VERSION_CODE_SOURCE="play_max_plus_one"
          fi

          if [ "$SELECTED_VERSION_CODE" -lt 1 ] || [ "$SELECTED_VERSION_CODE" -gt 2100000000 ]; then
            echo "Selected version code $SELECTED_VERSION_CODE is outside the allowed range 1..2100000000." >&2
            exit 1
          fi

          if [ "$PLAY_MAX_OUTPUT" != "none" ] && [ "$SELECTED_VERSION_CODE" -le "$PLAY_MAX_VERSION_CODE" ]; then
            echo "Selected version code $SELECTED_VERSION_CODE must be greater than current Play max $PLAY_MAX_VERSION_CODE." >&2
            exit 1
          fi

          echo "play_max_version_code=$PLAY_MAX_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "selected_version_code=$SELECTED_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_code_source=$VERSION_CODE_SOURCE" >> "$GITHUB_OUTPUT"

          echo "::notice title=Google Play version preflight::play_max_version_code=$PLAY_MAX_OUTPUT selected_version_code=$SELECTED_VERSION_CODE source=$VERSION_CODE_SOURCE"
          echo "Play max version code: $PLAY_MAX_OUTPUT"
          echo "Selected version code: $SELECTED_VERSION_CODE"
          echo "Version code source: $VERSION_CODE_SOURCE"

      - name: Write Supabase credentials to local.properties
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Verify Android Supabase runtime config
        run: ./gradlew :androidApp:verifySupabaseRuntimeConfig

      - name: Build Release APK (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          ./gradlew :androidApp:assembleRelease \
            :androidApp:verifyReleaseCueResources \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pversion.code=${{ steps.version.outputs.selected_version_code }}
          rm keystore.jks

      - name: Rename APK with version
        id: rename_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -1)
          TAG="${{ inputs.release_tag }}"
          NEW_NAME="ProjectPhoenix-${TAG}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed APK to: $NEW_NAME"

      # This workflow may build a historical tag, whose checkout predates the helper.
      # Fetch it from the immutable workflow revision rather than the build checkout.
      - name: Fetch pinned release asset replacement helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.workflow_sha }}/.github/scripts/replace_release_asset.py" \
            --output "$RUNNER_TEMP/replace_release_asset.py"
          python3 -m py_compile "$RUNNER_TEMP/replace_release_asset.py"

      - name: Stage and promote APK on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/replace_release_asset.py" \
            "${{ inputs.release_tag }}" \
            "${{ steps.rename_apk.outputs.apk_path }}" \
            "ProjectPhoenix-${{ inputs.release_tag }}.apk"
