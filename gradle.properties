# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m

# Kotlin/Native memory settings (needs extra for DevirtualizationAnalysis).
# DevirtualizationAnalysis may need more than 8 GiB for the iOS release link.
# iOS release workflows use the standard macos-26-intel image (x64, 14 GB);
# macos-26 ARM64 runners provide only 7 GB and cannot host this heap. The larger
# macos-26-large (30 GB) works too but is always billed and drains the spending limit.
kotlin.native.jvmArgs=-Xmx12g
# Note: SQLite JDBC VerifyMigrationTask may fail on Windows if java.io.tmpdir resolves
# to a protected directory (e.g., C:\Windows). The task runs correctly in CI (Linux).
# If needed locally, set GRADLE_OPTS=-Djava.io.tmpdir=%TEMP% before running.

# Enable parallel execution for faster builds
org.gradle.parallel=true

# Enable configuration cache for faster configuration phase
org.gradle.configuration-cache=true

# AndroidX migration
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enable Kotlin Multiplatform

# Suppress iOS target warnings on non-macOS machines
kotlin.native.ignoreDisabledTargets=true

# Disable default hierarchy template (using explicit dependsOn for iOS)
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.daemon.jvmargs=-Xmx12g
