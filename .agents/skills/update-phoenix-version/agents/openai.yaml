interface:
  display_name: "Update Phoenix Version"
  short_description: "Bump Phoenix app versions in sync"
  default_prompt: "Use $update-phoenix-version to read the current Android versionName and default versionCode from androidApp/build.gradle.kts, then bump that version. Keep Constants.APP_VERSION and both iOS MARKETING_VERSION values aligned with the new versionName. Do not apply an older example version."
